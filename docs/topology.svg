<svg xmlns="http://www.w3.org/2000/svg" width="880" height="216" viewBox="0 0 880 216" role="img" aria-label="Topology: browser Web UI, single-binary agent-matrix server, and agents connecting outbound only">
  <style>
    .t { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1f2937; }
    .s { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #5b6470; }
    .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #6b7280; }
    .card { fill: #f8fafc; stroke: #dbe1e8; stroke-width: 1.5; }
    .hl { fill: rgba(13,148,136,0.07); stroke: #0d9488; stroke-width: 1.5; }
    .teal { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #0f766e; }
    .ln { stroke: #9aa3ad; stroke-width: 1.6; fill: none; marker-end: url(#arr); }
    .wire { stroke: #9aa3ad; stroke-width: 1.4; fill: none; }
    .arrF { fill: #9aa3ad; }
    .cap { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 10px; fill: #6b7280; }
    .capT { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; fill: #0f766e; }
    @media (prefers-color-scheme: dark) {
      .t { fill: #e6edf3; }
      .s { fill: #9aa4b0; }
      .m { fill: #8b949e; }
      .card { fill: #161b22; stroke: #30363d; }
      .hl { fill: rgba(45,212,191,0.08); stroke: #2dd4bf; }
      .teal { fill: #2dd4bf; }
      .ln, .wire { stroke: #6b7280; }
      .arrF { fill: #6b7280; }
      .cap { fill: #8b949e; }
      .capT { fill: #2dd4bf; }
    }
  </style>
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" class="arrF"/>
    </marker>
  </defs>

  <!-- 左：浏览器管理端 -->
  <rect x="40" y="68" width="190" height="80" rx="8" class="card"/>
  <text x="64" y="100" class="t" font-size="16" font-weight="700">Web UI</text>
  <text x="64" y="122" class="s" font-size="12">browser · zero install</text>

  <!-- 中：服务端 -->
  <rect x="320" y="48" width="210" height="120" rx="8" class="hl"/>
  <text x="342" y="88" class="teal" font-size="16" font-weight="700">agent-matrix</text>
  <text x="342" y="112" class="m" font-size="12">single binary · SQLite</text>
  <text x="342" y="134" class="m" font-size="12">embeds Web UI + setup.sh</text>

  <!-- 右：三台 Agent 机器 -->
  <rect x="680" y="16" width="170" height="46" rx="8" class="card"/>
  <text x="700" y="40" class="t" font-size="13" font-weight="600" dominant-baseline="central">agent · openclaw</text>
  <rect x="680" y="78" width="170" height="46" rx="8" class="card"/>
  <text x="700" y="102" class="t" font-size="13" font-weight="600" dominant-baseline="central">agent · hermes</text>
  <rect x="680" y="140" width="170" height="46" rx="8" class="card"/>
  <text x="700" y="164" class="t" font-size="13" font-weight="600" dominant-baseline="central">agent · any CLI</text>

  <!-- 管理通道：浏览器 → 服务端 -->
  <line x1="236" y1="108" x2="312" y2="108" class="ln"/>
  <text x="274" y="92" class="cap" text-anchor="middle">HTTPS</text>

  <!-- 纳管通道：Agent 汇聚后外拨服务端 -->
  <line x1="680" y1="39" x2="666" y2="101" class="wire"/>
  <line x1="680" y1="101" x2="666" y2="101" class="wire"/>
  <line x1="680" y1="163" x2="666" y2="101" class="wire"/>
  <line x1="666" y1="101" x2="538" y2="101" class="ln"/>
  <text x="606" y="86" class="cap" text-anchor="middle">heartbeat · pull tasks</text>
  <text x="606" y="122" class="cap" text-anchor="middle">write back results</text>

  <!-- 底部图例 -->
  <text x="440" y="204" class="capT" text-anchor="middle">agents dial out only · zero inbound connections</text>
</svg>
